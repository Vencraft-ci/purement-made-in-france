<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Purement Made in France — Boutique en ligne</title>
<meta name="description" content="Boutique en ligne de produits cosmétiques pour toute la famille et divers. Livraison à Abidjan et en dehors d'Abidjan. Commande par WhatsApp.">
<meta name="theme-color" content="#12239E">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<meta property="og:title" content="Purement Made in France"><meta property="og:description" content="Boutique en ligne de produits cosmétiques pour toute la famille et divers. Commandez sur WhatsApp.">
<meta property="og:image" content="https://vencraft-ci.github.io/purement-made-in-france/img/apercu-partage.jpg"><meta name="twitter:card" content="summary_large_image">

<body>
<header>
  <div class="hd">
    <button class="ib" id="bMenu" aria-label="Ouvrir le menu"></button>
    <a class="brand" href="#" aria-label="Accueil"><img src="img/logo.png" alt="Logo Purement Made in France" width="46" height="46"><span><b>PUREMENT<em>MADE IN FRANCE</em></b><small>Boutique en ligne · Côte d'Ivoire</small></span></a>
    <a class="ib wab" id="bWa" aria-label="Poser une question sur WhatsApp"></a>
  </div>
  <div class="srch"><span id="sIc"></span><button id="qc" class="qc" hidden aria-label="Effacer la recherche">✕</button><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Rechercher : biberon verre, Avent, soins, 39…" aria-label="Rechercher"></div>
</header>
<main id="app"></main>
<nav class="bar" id="bar" aria-label="Navigation"></nav>
<noscript><p style="padding:20px">Activez JavaScript pour utiliser la boutique, ou écrivez-nous sur WhatsApp : +225 01 03 88 83 48.</p></noscript>
<script src="catalogue.js"></script>
<script>
/* ===== RÉGLAGES (modifiables sans toucher au reste) ===== */
const CFG={
  wa:'2250103888348', waShow:'01 03 88 83 48', tel:'2250708810339', telShow:'07 08 81 03 39',
  fb:'https://www.facebook.com/share/1H7MjivBYt/',
  tt:'https://www.tiktok.com/@purement.made.in?_r=1&_t=ZS-9AJB3ZFIb12',
  map:"Abidjan, Côte d'Ivoire",
  zones:[['Bingerville',2500],['Abatta',2000],['Faya',2000],['Gonzague',2000],['Anani',2000],['Songon',3000],['Bassam',3000],['Les autres communes',1500]],
  pay:['Espèces à la livraison','Orange Money','MTN Mobile Money','Wave','Moov Money'],
  slides:[
   ['BIENVENUE CHEZ PUREMENT MADE IN FRANCE 💙','Tout pour bébé et toute la famille — choisi avec soin','Biberons, repas de bébé, allaitement, coffrets naissance et soins. Commandes 7j/7 — 24h/24, livraison à Abidjan et en dehors d\'Abidjan.'],
   ['BIBERONS','Le biberon qu\'il vous faut — en verre ou en plastique','Dodie, NUK, Avent, Twistshake, MAM : du 0-6 mois au 6 mois et +, avec les modèles anti-colique et les lots de 2.'],
   ['REPAS DE BÉBÉ','Tasses, gourdes et bavoirs — pour chaque repas','Tasses d\'apprentissage, gourdes avec paille, boîtes doseuses et bavoirs : tout pour les repas de bébé.'],
   ['COFFRETS NAISSANCE 🎁','Le cadeau de naissance — en coffret','Les coffrets Dodie, Avent et MAM, prêts à offrir.'],
   ['SOINS 🧴','Soins visage et corps — Bioré, CeraVe, Cicabiafine','Nettoyants, exfoliants, soins concentrés, laits et baumes hydratants. Commandez en un message sur WhatsApp.']],
  badges:{} /* ex. {39:'Nouveau', 13:'Meilleure vente'} : numéro du produit (plus petit N° de ses articles) */
};
/* ===== OUTILS ===== */
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(3,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=n=>n.toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,'\u00a0')+'\u00a0F';
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const IC={menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',truck:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',cart:'<path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',wa:'<path d="M4 20l1.3-4A8 8 0 1112 20a8 8 0 01-3.7-.9L4 20z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .8c-.8-.4-1.600-1.200-2-2l.8-1-1-2z"/>',ch:'<path d="M9 6l6 6-6 6"/>',ok:'<path d="M5 12l5 5 9-10"/>',mn:'<path d="M6 12h12"/>',pl:'<path d="M12 6v12M6 12h12"/>',tr:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
const ic=(n,x='')=>`<svg class="i ${x}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const im=(name,alt='')=>`<img loading="lazy" src="img/${name}.jpg" alt="${esc(alt)}" onerror="this.onerror=null;this.src='img/logo.png';this.classList.add('fb')">`;
const sv=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const st=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const SITE=location.protocol.startsWith('http')?location.origin+location.pathname.replace(/\/[^\/]*$/,''):'';
function toast(t,a){const e=document.createElement('div');e.className='toast';e.innerHTML=esc(t)+(a?` <button onclick="go('panier')">${a}</button>`:'');document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function burst(el,em=['❤️','💙','🤍','✨'],n=10){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<n;i++){const s=document.createElement('span');s.className='bu';s.textContent=em[i%em.length];s.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.random()-.5)*170}px;--dy:${-60-Math.random()*120}px;--r:${(Math.random()-.5)*70}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
/* ===== DONNÉES ===== */
const P=[],BY={},IT={};
CATS.forEach(c=>{c.slug=slug(c.name);c.count=0;c.subs.forEach(s=>{s.brand=s.title.includes(', ')?s.title.split(', ').pop():s.title;s.img='souscat-'+c.slug+'-'+slug(s.brand);s.cat=c;s.products.forEach(p=>{p.sub=s;p.cat=c;p.id=Math.min(...p.items.map(i=>i.n));p.items.forEach(i=>{i.prod=p;IT[i.n]=i});p.hay=norm([p.name,p.desc,s.title,c.name,...p.items.map(i=>i.d)].join(' '));P.push(p);BY[p.id]=p;c.count++})})});
const cover=p=>'produit-'+pad(p.id);
const subList=s=>{let l=s.products;if(s.cat.id==1){const b=CATS[4].subs.find(x=>x.brand==s.brand);if(b)l=l.concat(b.products)}return l};
const priceTag=p=>{const a=p.items.map(i=>i.p),m=Math.min(...a);return a.every(x=>x==m)?F(m):'Dès '+F(m)};
/* ===== ÉTAT ===== */
let cart=sv('pmf_cart',{}),favs=sv('pmf_fav',[]),cur='home';
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const saveCart=()=>{st('pmf_cart',cart);bar()};
function addC(n,q,silent){cart[n]=(cart[n]||0)+q;saveCart();if(!silent)toast('Ajouté au panier ❤️','Voir le panier')}
function tfav(id,e){if(e)e.stopPropagation();const k=favs.indexOf(id);k<0?favs.push(id):favs.splice(k,1);st('pmf_fav',favs);document.querySelectorAll('.fav[data-id="'+id+'"]').forEach(b=>b.classList.toggle('on',k<0));if(k<0&&e)burst(e.currentTarget,['❤️','💖','💙','✨'],9)}
/* ===== COUCHES ===== */
const stack=[];let skip=0;
function layer(html,cls=''){const el=document.createElement('div');el.className='ov '+cls;el.innerHTML=html;document.body.appendChild(el);document.body.classList.add('lock');requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));el.addEventListener('click',e=>{if(e.target===el)back()});el.querySelectorAll('[data-x]').forEach(b=>b.onclick=back);stack.push(el);history.pushState({L:1},'');return el}
const back=()=>{stack.length&&history.back()};
function popTop(){const el=stack.pop();if(!el)return;el.classList.remove('on');setTimeout(()=>el.remove(),260);if(!stack.length)document.body.classList.remove('lock')}
addEventListener('popstate',()=>{if(skip){skip=0;return}popTop()});
addEventListener('keydown',e=>{if(e.key==='Escape')back()});
function go(h){/* ferme les couches puis navigue */const n=stack.length;if(!n){if(location.hash.slice(1)==h)route();else location.hash=h;return}stack.splice(0).forEach(el=>{el.remove()});document.body.classList.remove('lock');skip=1;history.go(-n);setTimeout(()=>{location.hash=h;route()},90)}
const X=`<button class="x" data-x aria-label="Fermer">${ic('x')}</button>`;
/* ===== COMPOSANTS ===== */
function card(p,hi,fn='openP'){const n=p.items.length;return `<article class="card" onclick="${fn}(${p.id}${hi?','+hi:''})"><div class="ph">${im(cover(p),p.name)}<button class="fav ${favs.includes(p.id)?'on':''}" data-id="${p.id}" aria-label="Favori" onclick="tfav(${p.id},event)">${ic('heart')}</button></div><div class="cd"><span class="pill">${esc(p.sub.title)}</span><h3>${esc(p.name)}</h3><b class="pc">${priceTag(p)}</b>${CFG.badges[p.id]?`<span class="bdg">${esc(CFG.badges[p.id])}</span>`:''}<span class="v${n>1?' mdl':''}">${n>1?n+' modèles à choisir':'Voir le produit'}</span></div></article>`}
const grid=l=>`<div class="grid">${l.map(p=>card(p)).join('')}</div>`;
const orderBtn=(t,c='btn red')=>`<button class="${c}" onclick="startOrder()">${ic('wa')} ${t}</button>`;
const NAV=[['home','Accueil','home'],['localisation','Localisation','pin'],['livraison','Livraison','truck'],['panier','Panier','cart']];let lastN=0;
function bar(){const b=$('#bar');if(!b.firstChild)b.innerHTML='<i class="ind"></i>'+NAV.map(([k,l,i])=>`<button data-k="${k}" onclick="go('${k=='home'?'':k}')"><span class="bi">${ic(i)}</span>${l}${k=='panier'?'<span class="bd"></span>':''}</button>`).join('');
  const i=NAV.findIndex(x=>x[0]==cur);b.querySelectorAll('button').forEach((x,k)=>x.classList.toggle('on',k==i));const d=b.querySelector('.ind');d.style.opacity=i<0?0:1;d.style.transform=`translateX(${Math.max(i,0)*100}%)`;
  const bd=b.querySelector('.bd'),n=cnt(),bi=b.querySelector('[data-k=panier] .bi');bd.textContent=n||'';if(n>lastN){bd.classList.remove('bump');void bd.offsetWidth;bd.classList.add('bump');bi.classList.add('jump');setTimeout(()=>bi.classList.remove('jump'),650)}lastN=n}
function footer(){return `<footer><div class="in"><div><div class="id"><img src="img/logo.png" alt=""><b>Purement Made in France</b></div><p style="display:block;min-height:0;margin-top:8px">Boutique en ligne de produits cosmétiques pour toute la famille et divers — Livraison à Abidjan et en dehors d'Abidjan</p></div>
<div><h4>CONTACT</h4><a href="tel:+${CFG.tel}">${ic('wa')}&nbsp;${CFG.telShow}</a><a href="#" onclick="startOrder();return false">${ic('wa')}&nbsp;WhatsApp ${CFG.waShow}</a><h4 style="margin-top:12px">SUIVEZ-NOUS</h4><a href="${CFG.fb}" target="_blank" rel="noopener">Facebook · Purement Made In France</a><a href="${CFG.tt}" target="_blank" rel="noopener">TikTok · Purement Made In France</a></div>
<div><h4>LIVRAISON ET HORAIRES</h4><a href="#livraison">Livraison à Abidjan (toutes les communes) et en dehors d'Abidjan</a><p>Commandes 7j/7 — 24h/24</p><p>Boutique en ligne uniquement</p><a href="#" onclick="shareSite();return false">${ic('share')}&nbsp;Partager le site</a></div>
<small>© 2026 Purement Made in France. Tous droits réservés.</small></div></footer>`}
/* ===== VUES ===== */
const V={
home(){
  const sel=CATS.map(c=>c.subs[0].products[0]);
  return `<section class="car" id="car">${CFG.slides.map((s,i)=>{const[t,h,a]=s,[m,e]=h.split(' — ');return `<div class="sl ${i?'':'on'}" data-i="${i}"><div class="tc"><small>${esc(t)}</small><h2>${esc(m)}${e?`<i>${esc(e)}</i>`:''}</h2><p>${esc(a)}</p></div><div class="cb"><button class="btn red" onclick="document.getElementById('cats').scrollIntoView()">Voir le catalogue</button><button class="btn o" onclick="startOrder()">Commander sur WhatsApp</button></div></div>`}).join('')}<div class="dots">${CFG.slides.map((_,i)=>`<button class="${i?'':'on'}" aria-label="Image ${i+1}" data-d="${i}"></button>`).join('')}</div></section>
<div class="wrap"><div class="sec"><div class="kick">Sélection du moment</div><h2>À découvrir</h2>${grid(sel)}</div>
<div class="sec" id="cats"><div class="kick">Catalogue</div><h2>Nos catégories</h2><div class="cats">${CATS.map(c=>`<button class="ct" onclick="go('c${c.id}')">${im('cat-'+c.slug,c.name)}<b>${c.name}</b></button>`).join('')}</div></div>
<div class="box"><span class="open">Ouvert 24h/24</span><h3 style="margin:8px 0 4px">Commandes 7j/7 — 24h/24</h3><p style="margin:0">Livraison à Abidjan (toutes les communes) et en dehors d'Abidjan, tarifs selon la zone. <a href="#livraison" style="color:var(--b);font-weight:700">Voir la livraison</a></p></div>
<div class="box" style="text-align:center"><h3>Commandez en un message</h3><p>Choisissez vos articles puis envoyez votre commande sur WhatsApp.</p>${orderBtn('Commander sur WhatsApp')}</div></div>`},
cat(id){const c=CATS.find(x=>x.id==id);if(!c)return V.home();
  return `<div class="ph-head">${im('cat-'+c.slug)}</div><div class="wrap"><div class="crumb"><a href="#">Accueil</a> › ${c.name}</div><h1>${c.name}</h1><p style="opacity:.7;margin:4px 0">${c.count} produits</p>${c.subs.map(s=>`<div class="sub-h">${im(s.img)}<h2>${esc(s.title)}</h2></div>${grid(subList(s))}`).join('')}</div>`},
sub(id){let s,c;CATS.forEach(k=>k.subs.forEach(x=>{if(x.id==id){s=x;c=k}}));if(!s)return V.home();
  return `<div class="wrap"><div class="crumb"><a href="#">Accueil</a> › <a href="#c${c.id}">${c.name}</a> › ${esc(s.brand)}</div><h1>${esc(s.title)}</h1><p style="opacity:.7;margin:4px 0 14px">${subList(s).length} produits</p>${grid(subList(s))}</div>`},
list(title,l){return `<div class="wrap"><div class="crumb"><a href="#">Accueil</a> › ${esc(title)}</div><h1>${esc(title)}</h1><p style="opacity:.7">${l.length} produit(s)</p>${l.length?grid(l):`<div class="empty"><p>Aucun résultat.</p>${orderBtn('Nous écrire sur WhatsApp','btn')}</div>`}</div>`},
livraison(){return `<div class="wrap"><div class="sec"><div class="kick">Livraison rapide</div><button class="tg" id="tz"><h2 style="margin:0">Zones de livraison</h2>${ic('ch','')}</button><div id="zl">${CFG.zones.map(([z,p])=>`<div class="zone">${ic('ok')}<span>${z}</span><b>${F(p)}</b></div>`).join('')}</div><p>Livraison dans toutes les communes d'Abidjan et en dehors d'Abidjan. Autre localité : le tarif est confirmé par WhatsApp.</p>${orderBtn('Commander sur WhatsApp')}</div></div>`},
localisation(){const q=encodeURIComponent(CFG.map);return `<div class="wrap"><div class="sec"><div class="kick">Où nous trouver</div><h2>Localisation</h2><div class="loc"><div class="pinw"><i></i><i></i><span>${ic('pin')}</span></div><div><b>Purement Made in France</b><small>Abidjan, Côte d'Ivoire — boutique en ligne</small></div></div><div class="mapf"><div class="mapb"><span>📍 Abidjan — chargement de la carte…</span><iframe title="Carte d'Abidjan" src="https://www.google.com/maps?q=${q}&z=11&output=embed" onload="this.style.opacity=1" referrerpolicy="no-referrer-when-downgrade"></iframe></div></div><div class="cb2">${orderBtn('Commander sur WhatsApp')}</div></div></div>`},
panier(){const k=Object.keys(cart);if(!k.length)return `<div class="wrap empty"><h2>Votre panier est vide</h2><p>Ajoutez des articles pour commander.</p><button class="btn" onclick="go('')">Voir les produits</button></div>`;
  let t=0;return `<div class="wrap"><h1 style="margin-top:16px">Mon panier</h1>${k.map(n=>{const i=IT[n],q=cart[n];t+=i.p*q;return `<div class="ln">${im('produit-'+pad(n))}<div><b>${esc(i.prod.name)}</b>N°${n}${i.d?' — '+esc(i.d):''}<br><span style="color:var(--b);font-weight:700">${F(i.p)}</span></div><div style="flex:none;text-align:center"><div class="qty"><button aria-label="Moins" onclick="cq(${n},-1)">${ic('mn')}</button><span>${q}</span><button aria-label="Plus" onclick="cq(${n},1)">${ic('pl')}</button></div></div></div>`}).join('')}
  <div class="tot"><span>Sous-total</span><span>${F(t)}</span></div><p style="font-size:14px;opacity:.75">Frais de livraison selon votre zone (1 500 F à 3 000 F), ajoutés à la dernière étape.</p>${orderBtn('Commander','btn red')} <button class="btn out" onclick="cart={};saveCart();route()">Vider le panier</button>${sec('Complétez votre commande',cross(Object.keys(cart).map(n=>IT[n].prod)),'openP')}</div>`},
favoris(){return V.list('Mes favoris',favs.map(id=>BY[id]).filter(Boolean))}
};
function cq(n,d){cart[n]+=d;if(cart[n]<=0)delete cart[n];saveCart();route()}
/* ===== ROUTEUR ===== */
function route(){const h=location.hash.slice(1);let v,k='';
  if(h[0]=='c'&&!isNaN(h.slice(1))){v=V.cat(h.slice(1))}
  else if(h[0]=='s'){v=V.sub(h.slice(1))}
  else if(h[0]=='p'&&!isNaN(h.slice(1))){const n=+h.slice(1);v=V.home();setTimeout(()=>{if(IT[n]){history.replaceState(null,'','#');openP(IT[n].prod.id,n)}},50)}
  else if(h.startsWith('r:')){const f=SHORT[+h.slice(2)];v=V.list(f[0],f[1]())}
  else if(['livraison','localisation','panier','favoris'].includes(h)){v=V[h]();k=h}
  else{v=V.home();k='home'}
  cur=k||(h?'':'home');if(!h)cur='home';
  $('#app').innerHTML=v+footer();$('#q').value='';$('#qc').hidden=true;searching=false;bar();scrollTo(0,0);if(!h)carousel();else clearInterval(tm);const tz=$('#tz');if(tz)tz.onclick=()=>{tz.classList.toggle('cl');$('#zl').hidden=!$('#zl').hidden}}
addEventListener('hashchange',()=>{if(!stack.length)route()});
/* ===== CARROUSEL ===== */
let tm,ci=0;
function carousel(){clearInterval(tm);const sl=[...document.querySelectorAll('.sl')];if(!sl.length)return;ci=0;
  sl.forEach((s,i)=>{const img=new Image();img.onload=()=>s.style.backgroundImage=`url(img/accueil-0${i+1}.jpg)`;img.onerror=()=>s.classList.add('nobg');img.src=`img/accueil-0${i+1}.jpg`});
  const show=i=>{ci=(i+sl.length)%sl.length;sl.forEach((s,k)=>s.classList.toggle('on',k==ci));document.querySelectorAll('.dots button').forEach((b,k)=>b.classList.toggle('on',k==ci))};
  const play=()=>{clearInterval(tm);tm=setInterval(()=>show(ci+1),4000)};play();
  document.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{show(+b.dataset.d);play()});
  const c=$('#car');let x0=null;c.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;clearInterval(tm)},{passive:true});
  c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)show(ci+(dx<0?1:-1));play()})}
/* ===== MENU ===== */
function openMenu(){const el=layer(`<div class="sheet"><div class="menu">${X}<h2>Catégories</h2>${CATS.map(c=>`<button class="mi" data-c="${c.id}"><span>${c.id}. ${c.name}</span><i>(${c.count})</i>${ic('ch','c')}</button><div class="ms" id="m${c.id}"><button onclick="go('c${c.id}')"><b>Tout voir</b></button>${c.subs.map(s=>`<button onclick="go('s${s.id}')">${esc(s.brand)}</button>`).join('')}</div>`).join('')}<div class="sep"></div>

const STOP=new Set('de du des la le les en et pour a au un une d l sur avec'.split(' '));
const stem=w=>w.length>3&&/[sx]$/.test(w)?w.slice(0,-1):w;
const toks=t=>norm(t).replace(/(\d)\s(?=\d{3}\b)/g,'$1').replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w&&!STOP.has(w)).map(stem);
const SYN={cadeau:['coffret'],gobelet:['tasse'],savon:['liquide','nettoyant'],vaisselle:['liquide'],bib:['biberon'],cosmetique:['soin'],peau:['soin','baume'],creme:['baume'],sucette:['coffret'],naissance:['coffret'],tetine:['biberon'],cuillere:['repas'],manger:['repas'],boire:['tasse','gourde']};
const POP=['Biberon en verre','Avent','MAM','Coffret naissance','Bavoir','Anti-colique','Lot de 2','Soins visage'];
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]==b[j]){i++;j++}else{if(++e>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++}}}return e+(a.length-i)+(b.length-j)<=1}
const ms=(q,ws)=>{let b=0;for(const w of ws){const s=w==q?1:q.length>1&&w.startsWith(q)?.85:q.length>2&&w.includes(q)?.5:q.length>4&&lev1(q,w)?.45:0;if(s>b)b=s}return b};
P.forEach(p=>{p.W1=[...new Set(toks(p.name+' '+p.sub.title))];p.W2=[...new Set(toks(p.cat.name+' '+p.desc+' '+p.items.map(i=>i.d).join(' ')))];p.items.forEach(i=>i.W=toks(i.d+' '+i.n+' '+i.p))});
function find(v){const q=toks(v);if(!q.length)return{l:[],q,near:false};
  const sc=(t,p)=>{if(/^\d+$/.test(t)){const n=+t;return n<1000?(IT[n]&&IT[n].prod==p?5:0):(p.items.some(i=>i.p==n)?3:0)}return Math.max(...[t,...(SYN[t]||[])].map(a=>Math.max(ms(a,p.W1)*3,ms(a,p.W2)*1.5)))};
  const r=P.map(p=>{const s=q.map(t=>sc(t,p));return{p,all:s.every(x=>x>0),t:s.reduce((a,b)=>a+b,0)}});
  let l=r.filter(x=>x.all),near=false;if(!l.length){l=r.filter(x=>x.t>0);near=true}
  l.sort((a,b)=>b.t-a.t||a.p.id-b.p.id);return{l:l.map(x=>x.p),q,near}}
const hiOf=(p,q)=>{if(p.items.length<2)return 0;let b=0,bn=0,mn=1e9;p.items.forEach(i=>{const s=q.reduce((a,t)=>a+ms(t,i.W),0);if(s>b){b=s;bn=i.n}mn=Math.min(mn,s)});return b>mn?bn:0};

function sview(v){searching=true;clearInterval(tm);const A=$('#app');
  if(!v.trim()){A.innerHTML=`<div class="wrap"><p class="kick" style="margin-top:18px">Recherches populaires</p><div class="chips">${POP.map(x=>`<button onclick="sq('${x}')">🔍 ${x}</button>`).join('')}</div><p class="kick">Catégories</p><div class="chips">${CATS.map(c=>`<button onclick="go('c${c.id}')">${c.name}</button>`).join('')}</div></div>`;return}
  const{l,q,near}=find(v);const cm=[...CATS.map(c=>[c.name,'c'+c.id,toks(c.name)]),...CATS.flatMap(c=>c.subs.map(s=>[c.name+' › '+s.brand,'s'+s.id,toks(c.name+' '+s.title)]))].filter(x=>q.length&&q.every(t=>ms(t,x[2])>=.85)).slice(0,5);
  A.innerHTML=`<div class="wrap"><p style="margin:16px 0 6px;font-weight:700">${l.length} résultat(s) pour « ${esc(v.trim())} »</p>${cm.length?`<div class="chips">${cm.map(x=>`<button onclick="go('${x[1]}')">📂 ${esc(x[0])}</button>`).join('')}</div>`:''}${near&&l.length?'<p style="opacity:.7;margin:0 0 10px">Aucun résultat exact — voici les plus proches :</p>':''}${l.length?`<div class="grid">${l.map(p=>card(p,hiOf(p,q))).join('')}</div>`:`<div class="empty"><h3>Aucun résultat</h3><p>Essayez un autre mot (ex. « biberon », « Avent », « rose »), ou demandez-nous sur WhatsApp.</p><div class="chips" style="justify-content:center">${POP.slice(0,4).map(x=>`<button onclick="sq('${x}')">🔍 ${x}</button>`).join('')}</div>${orderBtn('Demander sur WhatsApp','btn')}</div>`}</div>`;scrollTo(0,0)}
